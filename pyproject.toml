[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graphkv"
version = "0.1.0"
description = "Graph-based dynamic KV-cache compression (ISCAS 2026) and Graph-KV structural attention (NeurIPS 2025)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.45",
]

[project.optional-dependencies]
experiments = ["datasets>=2.14", "matplotlib>=3.7", "numpy"]
neurips = ["huggingface_hub>=0.20", "pandas", "accelerate"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["graphkv*"]  # graphkv (ISCAS 2026) and graphkv_neurips (Graph-KV, NeurIPS 2025)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
